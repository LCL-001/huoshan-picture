services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: yu-ai-agent
    volumes:
      - mysql_data:/var/lib/mysql
      - ./create_sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "3307:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: yu_ai_agent_vector
      POSTGRES_USER: ${VECTOR_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${VECTOR_DB_PASSWORD:-postgres}
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VECTOR_DB_USERNAME:-postgres} -d yu_ai_agent_vector"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/yu-ai-agent
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      AI_DASHSCOPE_API_KEY: ${AI_DASHSCOPE_API_KEY}
      VECTOR_ENABLED: "true"
      VECTOR_DB_URL: jdbc:postgresql://pgvector:5432/yu_ai_agent_vector
      VECTOR_DB_USERNAME: ${VECTOR_DB_USERNAME:-postgres}
      VECTOR_DB_PASSWORD: ${VECTOR_DB_PASSWORD:-postgres}
    ports:
      - "8123:8123"
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgvector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./my-ai-agent-frontend/dist:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  pgvector_data:
