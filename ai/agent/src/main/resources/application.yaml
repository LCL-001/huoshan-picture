spring:
  application:
    name: huoshan-ai-agent
  profiles:
    active: ollama #local
  ai:
    model:
      # 2026-09-16：引擎侧已无任何 DashScope 用法——对话主脑、看图打标、会话摘要、会话标题
      # 全部走 app.ai.openai.*（厂商不绑死，当前是 MiMo），所以默认模型这两类显式关掉。
      # 关掉之后引擎能起在**没有 DashScope key** 的环境里（实测见
      # docs/decisions/2026-09-16-dashscope-decoupling.md）
      chat: none
      embedding: none
      # 其余模型类型显式关掉：OpenAI starter 的这四类自动装配都是 matchIfMissing = true，
      # 属性缺省即启用，会去建需要 api-key 的 OpenAi*Model Bean（T6）
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    # DashScope 集成整体关闭（2026-09-16 实测）：上面那个 `model.chat` 只管得到 chat 一条
    # 自动配置，而 DashScope 的 agent（`dashScopeAgent`）另有开关，key 为空时照样让启动失败
    # （`DashScope API key must be set`）。要重新启用 DashScope：去掉本项、把上面 chat /
    # embedding 改回 dashscope、并补回 `api-key`（形如 `api-key: ${AI_DASHSCOPE_API_KEY:}`）。
    dashscope:
      enabled: false
    # [LOCAL-ONLY-DISABLED] pgvector 向量库配置：全本地化改造（不使用向量数据库）暂时停用，恢复时取消注释
    #vectorstore:
    #  pgvector:
    #    index-type: HNSW
    #    dimensions: 1024
    #    distance-type: COSINE_DISTANCE
    #    max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
    # 搜图 MCP 服务（ai/image-search-mcp-server，默认 sse profile，端口 8127）——T9。
    # 只有图库助手会挂它的工具，MyManus 不受影响（见 HuoshanAssistantController 的装配）。
    mcp:
      client:
        # 服务没部署时可整体关掉，引擎照常起（图库助手少了搜图工具而已）
        enabled: ${AI_MCP_CLIENT_ENABLED:true}
        # 不在启动时初始化：MCP 服务没起也不该拖垮引擎启动，改成首次调用时再连
        initialized: false
        # 服务不可达时的感知上限就是 request-timeout 的默认值 20s（T19 实测 20.1s）——这把尺同时约束
        # 真实的 searchImage 调用，故不压小；失败即降级为空数组并进入 60s 冷却（McpToolCallbackResolver）
        sse:
          connections:
            image-search:
              url: ${AI_MCP_IMAGE_SEARCH_URL:http://localhost:8127}


  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/huoshan_ai_agent}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
#    # 向量库（pgvector）已随本地化改造停用。需要时通过环境变量注入连接串，
#    # 不要在仓库里写具体的云实例地址。
#    url: ${VECTOR_DB_URL:jdbc:postgresql://localhost:5432/yu_ai_agent_vector}
#    username: your username
#    password: your password
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

app:
  legacy-love:
    enabled: ${LEGACY_LOVE_ENABLED:false}
  vector:
    enabled: ${VECTOR_ENABLED:false}
    # [LOCAL-ONLY-DISABLED] pgvector 专用数据源：全本地化改造暂时停用，恢复时取消注释
    #datasource:
    #  jdbc-url: ${VECTOR_DB_URL:jdbc:postgresql://localhost:5432/yu_ai_agent_vector}
    #  username: ${VECTOR_DB_USERNAME:postgres}
    #  password: ${VECTOR_DB_PASSWORD:postgres}
    #  driver-class-name: org.postgresql.Driver
  # 图库助手用的 OpenAI 协议模型（T6）：主脑与 visionTagger 各一套配置，厂商不绑死。
  # base-url 填"协议根"，不要带尾部 /v1 —— Spring AI 的请求路径自带 /v1/chat/completions
  # （T6 实测：Ollama 填 http://localhost:11434 通；填 .../v1 会拼成双 /v1 报 404）。
  # 例：DashScope 兼容模式 https://dashscope.aliyuncs.com/compatible-mode、官方 OpenAI https://api.openai.com、
  #     本地 Ollama http://localhost:11434；其他厂商用其官方 base 去掉尾部 /v1 即可。
  # api-key 与 model 同时给全才算配置完成；未配置＝该用途不可用，普通会话不受影响。
  # 密钥走环境变量或 application-local.yaml（两者都不入版本库）。
  ai:
    openai:
      assistant:
        base-url: ${AI_OPENAI_BASE_URL:}
        api-key: ${AI_OPENAI_API_KEY:}
        model: ${AI_OPENAI_MODEL:}
        temperature: 0.4
        timeout: 60s
      vision:
        base-url: ${AI_OPENAI_VISION_BASE_URL:}
        api-key: ${AI_OPENAI_VISION_API_KEY:}
        model: ${AI_OPENAI_VISION_MODEL:}
        temperature: 0.2
        timeout: 120s
  # 图库助手（T8 档 1）：headless 端点（/ai/huoshan/chat）+ 图库 API 客户端。
  # headless-api-key 为空时端点一律拒绝（fail-closed）；密钥走环境变量，不入库。
  huoshan:
    base-url: ${HUOSHAN_BASE_URL:http://localhost:8123/api}
    headless-api-key: ${HUOSHAN_HEADLESS_API_KEY:}
    connect-timeout: 5s
    read-timeout: 30s

search-api:
  api-key: ${SEARCH_API_KEY:}

# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.lcl.myaiagent.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
  openapi:
    title: 接口文档
    version: 1.0
    group:
      test1:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.lcl.myaiagent.controller
server:
  port: 8124
  # 只监听回环（D1 收口，2026-09-15，见 docs/decisions/2026-09-15-D1-loopback.md）。
  # 引擎只服务同机的图库后端代理（AiAssistantProxyManager 打 http://localhost:8124/api），
  # 不需要从主机外可达。这一行让 /ai/manus/** 一族**零鉴权**的旧端点对外不可达——用网络隔离
  # 代替给它们补鉴权：那个端点服务的是冻结的 MyManus 前端，浏览器发不了自定义头，加 key 会把前端打死。
  # 注意：这是"没有攻击面"，不是"修好了鉴权"；CorsConfig 的通配 Origin 与抓取类工具的 SSRF
  # 都只是被缓解（本机进程仍可利用），未修。
  # 例外：若将来容器化，容器内 127.0.0.1 不可被端口映射访问，需显式覆盖本项。
  address: 127.0.0.1
  servlet:
    context-path: /api
    session:
      cookie:
        name: HUOSHAN_AI_SESSION
        path: /
      timeout: 7d

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: when-authorized

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    # 仅在开发环境开启日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
    enable-sql-runner: true
logging:
  level:
    org.springframework.ai: INFO
#kind: Application
