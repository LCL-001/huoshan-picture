server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 7 天过期；SameSite=Lax 防 CSRF 场景下的跨站携带；HttpOnly 防脚本读取
    session:
      cookie:
        max-age: 604800
        http-only: true
        same-site: lax

spring:
  application:
    name: yun-picture-backend
  profiles:
    active: local
  # 邮件（邮箱验证码）：本地在 application-local.yaml 填真实值，生产走 MAIL_* 环境变量
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
  # Redis 配置
  redis:
    database: 1
    host: 127.0.0.1
    port: 6379
    timeout: 5000
  # session 7 天过期（与 sa-token timeout 对齐）
  session:
    timeout: 604800
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yu_picture
    username: root
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
  #  profiles:
  #    active: local
  # 空间图片分表
  shardingsphere:
    datasource:
      names: yu_picture
      yu_picture:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://localhost:3306/yu_picture
        username: root
        password: ${DB_PASSWORD:}
    rules:
      sharding:
        tables:
          picture:
            actual-data-nodes: yu_picture.picture  # 动态分表
            table-strategy:
              standard:
                sharding-column: spaceId
                sharding-algorithm-name: picture_sharding_algorithm  # 使用自定义分片算法
        sharding-algorithms:
          picture_sharding_algorithm:
            type: CLASS_BASED
            props:
              strategy: standard
              algorithmClassName: com.lcl.yunpicturebackend.manager.sharding.PictureShardingAlgorithm
    props:
      sql-show: true
# 日志格式：在级别后追加 traceId，便于按一次请求串联全链路日志
logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    # 仅在开发环境开启日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
    enable-sql-runner: true
# 应用自定义配置
app:
  cors:
    # 默认面向本地开发；生产环境由 application-prod.yaml 覆盖为线上域名
    allowed-origins: http://localhost:*,http://127.0.0.1:*,https://www.lincode.online,https://lincode.online
  auth:
    # 图形/邮箱验证码校验与登录限流开关，默认开启；
    # 仅压测/联调时由 application-test.yaml 覆盖为 false
    captcha-enabled: true
    login-limit-enabled: true
  cache:
    # 缓存重建分布式锁的 TTL（秒）：必须大于"查库 + 组装 VO"的耗时上界，
    # 否则锁会在重建中途过期，让后来的请求重复回源
    rebuild-lock-ttl-seconds: 30
    # 重建耗时超过该值打 WARN，作为"TTL 余量可能不够"的早期信号
    rebuild-warn-ms: 5000
  outpainting:
    # 单用户每日可创建的 AI 扩图任务数上限（按量计费，防止狂点产生付费任务）
    daily-quota: 20
  websocket:
    # 编辑锁空闲多久后强制释放（毫秒，默认 5 分钟）：
    # 客户端异常断开不会触发关闭回调，靠这个上界兜底，避免图片被永久锁定
    edit-lock-idle-timeout-ms: 300000
    # 空闲锁扫描间隔（毫秒）
    edit-lock-sweep-interval-ms: 60000
  bing-image:
    # Bing 图片搜索结果的 DOM 契约（改版时只改这里，并由 BingImageParserContractTest 先行暴露）
    container-selector: ".dgControl"
    item-selector: ".iusc"
    # 条目上存放元数据的属性名，值是 JSON 字符串
    metadata-attribute: "m"
    # 元数据 JSON 中原图地址的字段名
    image-url-field: "murl"
# Sa-Token 配置：satoken Cookie 默认可被 JS 读取，必须加 HttpOnly/SameSite；
# secure 仅在 application-prod.yaml 开启（本地 http 调试需要非 secure Cookie）
sa-token:
  token-name: satoken
  timeout: 604800
  cookie:
    http-only: true
    same-site: lax
# 运行指标：单独端口且只绑本机，避免在公网 /api 路径下暴露 actuator 运行信息
management:
  server:
    port: 8125
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: yun-picture-backend
knife4j:
  enable: true
  openapi:
    title: 接口文档
    version: 1.0
    group:
      test1:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.lcl.yunpicturebackend.controller