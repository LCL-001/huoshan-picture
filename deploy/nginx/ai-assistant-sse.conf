# lincode.online —— AI 助手 SSE 配置片段（D3）

> 2026-09-15 立。**合并进现有 `lincode.online:443` 的 server 块**，`nginx -t` 校验后 `reload`。

## 为什么需要它

助手对话是 **SSE 长连接，一帧一帧往下推**。nginx 的两处默认行为会直接破坏它：

| 默认行为 | 后果 |
|---|---|
| `proxy_buffering on` | 上游（后端 `SseEmitter`）推的帧被压在 nginx 缓冲区里，前端**折叠条不再逐步显示**，而是对话结束后一次性冒出来——这个功能就废了 |
| `proxy_read_timeout 60s` | 一次长对话超过 60s 就被 nginx 拦腰掐断，用户看到**裸断连**，而不是我们精心写的 error 文案 |
| gzip（若该 location 启用） | 压缩同样引入缓冲，效果与 `proxy_buffering on` 类似 |

**超时取值 360s 的理由**：后端代理与引擎的 `SseEmitter` 都是 **300s**（`AiAssistantProxyManager.EMITTER_TIMEOUT_MS` / `BaseAgent.SSE_TIMEOUT_MS`）。nginx 这一层**必须比应用侧长**，否则 nginx 先断、应用来不及发 `error` 帧与 `[DONE]`，超时形态就退化成"连接中断"。360s 留了 60s 余量。

## 片段

```nginx
# =============================================================================
# AI 助手 SSE（D3，2026-09-15）
# 前置假定：这个 server 块已有一条把 /api/ 反代到 127.0.0.1:8123 的 location。
#           若上游地址/端口不同，只改下面的 proxy_pass。
# =============================================================================
location /api/ai/assistant/ {
    proxy_pass http://127.0.0.1:8123;
    proxy_http_version 1.1;

    # —— SSE 必需：不缓冲、不缓存、不压缩 ——
    proxy_buffering off;
    proxy_cache off;
    gzip off;

    # —— 必须长于应用侧 300s 的 SseEmitter 超时 ——
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;

    # 登录态靠 Cookie / satoken 头判定，不得改写请求头
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # HTTP/1.1 + 清空 Connection 才能与上游 keep-alive（默认的 "close" 会让长流更容易被中间层断开）
    proxy_set_header Connection "";
}
```

**注意**：本片段**不带 `add_header`**，因此会**继承** server 块级别的安全响应头（CSP/HSTS 等，见另一份 `nginx-security.conf`）。若你现有的 `/api/` location 里自己写过 `add_header`，那处是独立的既有配置，不在本片段范围内。

**另一种做法（未采用）**：应用侧回 `X-Accel-Buffering: no` 响应头也能让 nginx 不再缓冲。但当前应用的代码没有设这个头，改 nginx 是零代码改动的路径，故选它。

## 上线后怎么验（别只看"页面能开"）

```bash
# 1) 先确认事件流是逐帧到达的，而不是结束时一次性吐出：
#    带一张有效 ticket 直接打后端（需登录态 Cookie），观察帧是否间隔出现
curl -N -H "Cookie: satoken=<...>; SESSION=<...>" \
  "https://www.lincode.online/api/ai/assistant/ticket" -X POST   # 先取票
curl -N "https://www.lincode.online/api/ai/assistant/chat?message=列出我的空间&ticket=<票>" 
# 期望：data:{"event":"notice"...} / data:{"event":"step"...} 依次到达，而不是最后一次性刷出

# 2) 响应头里不该出现 content-encoding: gzip，也不该有 x-accel-buffering: yes
curl -sI -H "Cookie: ..." "https://www.lincode.online/api/ai/assistant/chat?..." | grep -iE 'content-encoding|x-accel'

# 3) 最直接的判据：浏览器里看折叠条是否**逐步**增加步骤（这是本条配置唯一真正要保的功能）
```

## 边界（本次没验的）

- 我**没有你的服务器访问权**，本片段是**未在真机 nginx 上跑过**的（`nginx -t` 也没跑）。合并前请自行校验；合并后按上面三步验证。
- 若你的部署用的是别的反代（Caddy/Traefik/云厂商 LB），要关缓冲的开关不同（Caddy 一般默认就支持 SSE 流式；AWS ALB 需要调 idle timeout）。本片段只覆盖 nginx。
